apiVersion: appdarta.io/v1
kind: CodeTemplate
metadata:
  name: rest-gateway-test
  displayName: "REST Gateway (test fixture)"
  description: "GW-* compliant gateway scaffold: mounts routes from handler YAMLs, real middleware"
  version: "1.0.0"
  author: "AppDarta Platform"
spec:
  nodeKind: gateway
  techStacks: [Go]
  patternKind: rest-gateway
  files:
    - path: "gateway/router.go"
      template: "router.go.tmpl"
      description: "Route setup — reads in/out-handlers.yaml and mounts all handlers"
    - path: "gateway/middleware.go"
      template: "middleware.go.tmpl"
      description: "Middleware chain — bearer AuthGate + logging + request-ID injection (GW-NO-NOOP-MW compliant)"
    - path: "gateway/handlers/in/auth.go"
      template: "auth.go.tmpl"
      description: "AuthGate — v1 bearer-format auth contract (presence/format only, no crypto validation)"
    - path: "cmd/gateway/main.go"
      template: "main.go.tmpl"
      description: "Entry point — creates mux, wires middleware, calls routes.Setup"
    - path: "Dockerfile"
      template: "Dockerfile.tmpl"
      description: "Multi-stage Docker build targeting ./cmd/gateway"
  intelligence:
    maturityLevel: stable
    complexityFloor: 2
    complexityIdeal: 5
    complexityCeiling: 10
    tags: [gateway, go, rest, routes]
